name: Automated Data Pipeline

on:
  schedule:
    # Jadwal Upload: 01:00, 05:00, 09:00, 13:00, 18:00, 22:00 WIB (Diubah ke UTC)
    - cron: '0 18,22,2,6,11,15 * * *'
  workflow_dispatch: # Agar bisa dijalankan manual (Run workflow)

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Satpam Elit: Hanya bisa dijalankan oleh akun GitHub kamu
    if: github.actor == 'muhammadmdhf-spec' || github.event_name == 'schedule'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        # Instal Deno untuk memecahkan teks sandi YouTube
        curl -fsSL https://deno.land/install.sh | sh
        echo "$HOME/.deno/bin" >> $GITHUB_PATH
        # Update pip dan yt-dlp
        python -m pip install --upgrade pip
        pip install --upgrade yt-dlp yt-dlp-ejs

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Setup YouTube Cookies
      env:
        YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
      run: |
        # Mengubah Base64 menjadi file cookies.txt
        echo "$YT_COOKIES_B64" | base64 -d > cookies.txt

    - name: Execute Core Engine
      env:
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 }}
        GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
        GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        # Menjalankan mesin utama
        python process_data.py

name: Ultimate Muse AI Watermark Remover

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18,22,2,6,11,15 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.actor == 'muhammadmdhf-spec' || github.event_name == 'schedule'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg tmux
        curl -fsSL https://deno.land/install.sh | sh
        echo "$HOME/.deno/bin" >> $GITHUB_PATH
        python -m pip install --upgrade yt-dlp
        pip install -r requirements.txt
        pip install torch torchvision transformers
        pip install simple-lama-inpainting

    - name: Clone LaMA Repository & Download Model
      run: |
        git clone https://github.com/D-Ogi/WatermarkRemover-AI.git
        cd WatermarkRemover-AI
        wget -q https://github.com/Sanster/models/releases/download/add_big_lama/big-lama.pt
        cd ..

    - name: Setup Cookies (Pisah)
      env:
        FB_COOKIES: ${{ secrets.FB_COOKIES_B64 }}
        BILI_COOKIES: ${{ secrets.BILI_COOKIES_B64 }}
      run: |
        echo "$FB_COOKIES" | base64 -d > cookies_fb.txt
        echo "$BILI_COOKIES" | base64 -d > cookies_bili.txt

    - name: Execute Core Engine with Auto-Retry
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        for i in 1 2 3; do
          python process_data.py && break || sleep 10
        done
